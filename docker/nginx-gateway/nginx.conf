# Cerebrate 网关 — 本地 Nginx 反向代理（所有穿透入口）
# 通过路径后缀区分项目：/cerebrate/ → Cerebrate(8765)，其余项目可扩展
# 由 ngrok 隧道穿透到公网，实现"本机 = 公网服务器"
events {}

http {
    # 静态文件 MIME 类型（.js/.css/.svg 等必须正确识别，否则浏览器 Strict MIME 检查拒绝加载）
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 蒸馏等长请求必须放宽超时（LLM 链式整合 2-5 分钟）
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    # Docker 内嵌 DNS（运行时解析上游，避免启动/重载时解析失败）
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ── dsh（DeepSeek Harness）专属域名入口 ──
    # travel-lapped-python.ngrok-free.dev（ngrok 账号2 固定域名）→ 认证网关 3083 → dsh
    # 与 finale-earthworm-iciness.ngrok-free.dev（Cerebrate/DSEDT）按 Host 隔离，
    # dsh 的 /api/ 与 DSEDT 的 /api/ 不再冲突（各自独占域名）。
    # 精确 server_name 优先于下方 _ 兜底块。
    server {
        listen 80;
        server_name travel-lapped-python.ngrok-free.dev;

        location / {
            proxy_pass http://172.27.0.1:3083;   # 认证网关（TOTP/邮件码，宿主 127.0.0.1:3083）
            proxy_http_version 1.1;
            proxy_buffering off;                 # SSE 实时性
            proxy_set_header Upgrade $http_upgrade;   # WebSocket 透传
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }
    }

    server {
        listen 80 default_server;   # 默认 server：未匹配精确 server_name 的 Host（含 finale）走这里
        server_name _;

        # ── 安全：禁止 127.0.0.1 / localhost 直接访问（防绕过公网入口 / Host 伪造）──
        # 只允许通过 ngrok 公网域名访问；本机直连一律拒绝。
        if ($host ~* "^(127\.0\.0\.1|localhost)$") {
            return 444;
        }

        # ── Cerebrate 记忆中枢 ──
        location /cerebrate/ {
            proxy_pass http://cerebrate:8765/;   # 尾斜杠=剥离 /cerebrate/ 前缀
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Prefix /cerebrate;
            proxy_http_version 1.1;
        }

        # ── DSEDT Admin 管理后台（静态挂载 frontend/admin/dist）──
        location = /admin {
            return 301 /admin/;
        }
        location ^~ /admin/ {
            alias /usr/share/nginx/admin/;
            try_files $uri $uri/ /admin/index.html;
        }

        # ── DSEDT Admin API → UAT 后端（https://idverify-uat.gc.dsedt.gov.mo）──
        location /api/ {
            set $dsedt_uat https://idverify-uat.gc.dsedt.gov.mo;
            proxy_pass $dsedt_uat;
            proxy_set_header Host idverify-uat.gc.dsedt.gov.mo;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_ssl_server_name on;
            # 删除 Origin/Referer，等同服务端同源请求（规避 UAT 后端 CORS 校验 403）
            proxy_set_header Origin "";
            proxy_set_header Referer "";
            proxy_read_timeout 30s;
        }

        location / {
            return 404 "unknown project. try /cerebrate/";
        }
    }

    # ── dsh（DeepSeek Harness Web UI）公网入口 ──
    # 独立端口 3081：cloudflared → 127.0.0.1:3081 → 宿主桥 172.27.0.1:3082 → dsh 127.0.0.1:3080
    # Host 改写为 127.0.0.1:3080（dsh /api 信任围栏把 loopback Host 视为本机请求，放行特权端点）；
    # Origin 清空（浏览器同源 POST 带公网 Origin，与伪装 Host 不一致会被 fence 拒绝）。
    server {
        listen 3081;
        server_name _;

        location / {
            proxy_pass http://172.27.0.1:3082;
            proxy_http_version 1.1;
            # SSE 实时性关键：proxy_buffering off 让 dsh 的 text/event-stream
            # 数据即时转发（默认 on 会缓冲上游响应，SSE 事件攒着不发→前端
            # 只有结果才输出/需刷新才更新）
            proxy_buffering off;
            # dsh fence：Host=loopback → isLoopbackHostname 放行（含 PRIVILEGED_METHODS）
            proxy_set_header Host 127.0.0.1:3080;
            # Origin 清空：nginx 空值=移除该头，fence 的 Origin 检查跳过
            proxy_set_header Origin "";
            # WebSocket 升级（/api/events.mux、/api/events.host）
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }
    }
}
