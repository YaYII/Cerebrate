# Cerebrate 网关 — 本地 Nginx 反向代理（所有穿透入口）
# 通过路径后缀区分项目：/cerebrate/ → Cerebrate(8765)，其余项目可扩展
# 由 ngrok 隧道穿透到公网，实现"本机 = 公网服务器"
events {}

http {
    # 蒸馏等长请求必须放宽超时（LLM 链式整合 2-5 分钟）
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    server {
        listen 80;
        server_name _;

        # ── 安全：禁止 127.0.0.1 / localhost 直接访问（防绕过公网入口 / Host 伪造）──
        # 只允许通过 ngrok 公网域名访问；本机直连一律拒绝。
        if ($host ~* "^(127\.0\.0\.1|localhost)$") {
            return 444;
        }

        # ── Cerebrate 记忆中枢 ──
        location /cerebrate/ {
            proxy_pass http://cerebrate:8765/;   # 尾斜杠=剥离 /cerebrate/ 前缀
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Prefix /cerebrate;
            proxy_http_version 1.1;
        }

        # ── 其他项目扩展位（如 DSEDT 443）──
        # location /dsedt/ {
        #     proxy_pass https://172.17.0.1:443/;
        #     proxy_set_header Host $host;
        #     ...
        # }

        location / {
            return 404 "unknown project. try /cerebrate/";
        }
    }
}
