# Cerebrate v5 脑虫 Brain Server 编排
# ======================================
# 基准配置（生产默认）—— 无代码挂载，使用镜像运行。
#
# 环境覆盖文件:
#   开发环境: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#   生产环境: docker compose -f docker-compose.yml -f docker-compose.pro.yml up -d
#   默认:     docker compose up -d                  (同生产)
#
# 准备: cp .env.example .env  (填 CEREBRATE_SERVER_TOKEN、可选 ANTHROPIC_API_KEY)
# ======================================
services:
  cerebrate:
    build: .
    image: cerebrate:5.1.0
    container_name: cerebrate
    ports:
      - "127.0.0.1:8765:8765"
    env_file:
      - .env
    environment:
      CEREBRATE_SERVER_HOST: 0.0.0.0
      CEREBRATE_SERVER_PORT: "8765"
      CEREBRATE_MEMORY_ROOT: /data
      CEREBRATE_EMBEDDING_ALLOW_DOWNLOAD: "false"
      CEREBRATE_EMBEDDING_MODEL: "${CEREBRATE_EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}"
      CEREBRATE_EMBEDDING_MAX_LENGTH: "8192"
      CEREBRATE_HASH_EMBEDDING_DIM: "1024"
      CEREBRATE_CHUNK_ENABLED: "true"
      CEREBRATE_CHUNK_MAX_CHARS: "${CEREBRATE_CHUNK_MAX_CHARS:-8000}"
      CEREBRATE_RERANKER_ENABLED: "${CEREBRATE_RERANKER_ENABLED:-true}"
      CEREBRATE_UID: "${CEREBRATE_UID:-1000}"
      CEREBRATE_GID: "${CEREBRATE_GID:-1000}"
      HF_HOME: /models
    # 记忆数据持久化（chroma_data / personal / swarm 等全部落在 /data 下）
    # 数据与程序分离：升级镜像、重装 Docker 都不丢。
    volumes:
      - ${CEREBRATE_DATA_DIR:-./data}:/data
    restart: unless-stopped
