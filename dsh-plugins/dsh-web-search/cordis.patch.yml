# dsh-web-search 装配示例：加入 DSH host 的 cordis 配置
# 复制到 DSH 部署的 cordis.yml 或 patch 文件即可加载插件。
- insert:
    - id: dsh-web-search
      name: '@deepseek-ai/dsh-web-search'
      config:
        searxngUrl: 'http://127.0.0.1:18080'
        crawl4aiUrl: 'http://127.0.0.1:11235'
        crawl4aiToken: 'dsh-local-crawl-token-2026'
        jinaReaderUrl: 'https://r.jina.ai'
        timeoutMs: 30000
        maxResults: 8
        injectGuidance: true
